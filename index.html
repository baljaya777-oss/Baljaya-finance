<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BALJAYA FINANCE - Auto Detailing Management System</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- FontAwesome Icons -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- Google Fonts Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet">

<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        brand: {
          50: '#f0fdfa',
          100: '#ccfbf1',
          400: '#2dd4bf',
          500: '#14b8a6',
          600: '#0d9488',
          900: '#134e4a',
        },
        darkbg: '#0b0f17',
        cardbg: '#111827',
        bordercolor: '#1f2937'
      },
      fontFamily: {
        sans: ['Inter', 'sans-serif'],
      }
    }
  }
}
</script>

<style>
body {
  font-family: 'Inter', sans-serif;
  background-color: #0b0f17;
  color: #f3f4f6;
}

.glass-card {
  background: rgba(17, 24, 39, 0.88);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.glow-effect {
  box-shadow: 0 0 25px -5px rgba(20, 184, 166, 0.25);
}

.glow-gold {
  box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.25);
}

.custom-scrollbar::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

.custom-scrollbar::-webkit-scrollbar-track {
  background: #0b0f17;
}

.custom-scrollbar::-webkit-scrollbar-thumb {
  background: #374151;
  border-radius: 9999px;
}

@media print {
  .no-print {
    display: none !important;
  }

  .print-only {
    display: block !important;
  }

  body {
    background: white !important;
    color: black !important;
  }

  .glass-card {
    background: white !important;
    border: none !important;
    box-shadow: none !important;
    color: black !important;
  }

  .receipt-container {
    width: 100% !important;
    max-width: 100% !important;
    padding: 0 !important;
    color: black !important;
  }
}

.print-only {
  display: none;
}

/* BALJAYA booking reference layout */
.booking-action {
  position: relative;
  overflow: hidden;
}

.booking-action::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    120deg,
    rgba(255,255,255,.08),
    transparent 45%
  );
  pointer-events: none;
}

.booking-stat-card {
  min-height: 112px;
}

.booking-stat-card:hover {
  transform: translateY(-2px);
}

@media (max-width: 640px) {
  #page-booking {
    gap: 1rem;
  }

  .booking-stat-grid {
    gap: .75rem;
  }

  .booking-stat-card {
    min-height: 112px;
    padding: 1rem !important;
  }

  .booking-stat-card h3 {
    font-size: 1.85rem;
  }

  .booking-stat-card p {
    font-size: 10px;
    line-height: 1.35;
  }
}
</style>
